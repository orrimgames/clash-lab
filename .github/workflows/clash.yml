name: clash
on:
  workflow_dispatch:
    inputs:
      script:
        description: base64 of driver script
        required: true
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/android
          sudo mkdir -p /usr/local/lib/android
          sudo chown -R runner:runner /usr/local/lib/android
          df -h /
      - name: apk
        run: |
          curl -sL -o /tmp/apkeep https://github.com/EFForg/apkeep/releases/download/0.17.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x /tmp/apkeep
          mkdir -p /tmp/crout
          /tmp/apkeep -a com.supercell.clashroyale -d apk-pure /tmp/crout
          cd /tmp/crout && unzip -o -q com.supercell.clashroyale.xapk -d x
          ls -la /tmp/crout/x
      - name: kvm
        run: |
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
      - name: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: true
          cores: 4
          emulator-boot-timeout: 3600
          emulator-options: -no-snapshot-save -no-window -gpu guest -noaudio -no-boot-anim -memory 2048 -skin 480x800
          disable-animations: true
          script: |
            mkdir -p shots
            echo "${{ inputs.script }}" | base64 -d > drive.sh
            bash drive.sh
      - name: shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
