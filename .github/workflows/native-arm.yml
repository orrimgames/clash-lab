                      action='age23'
                  elif ('terms' in s and ('agree' in s or 'service' in s)):
                      enable(False);tap(580,870);action='terms'
                  elif ('sell' in s and ('information' in s or 'personal' in s)):
                      enable(False)
                      if not privacy:tap(100,744);privacy=True;time.sleep(.5)
                      tap(360,846);action='privacy'
                  elif 'player name' in s or 'choose your' in s:
                      enable(False)
                      if not named:
                          tap(300,401);adb('text','INSTINCT');adb('keyevent',4);named=True;time.sleep(1)
                      clickword(ws,'ok',450);action='name'
                  elif ('trainer' in s or 'royal trainers' in s) and not ('winner' in s or 'reward' in s):
                      P('/tmp/training').touch();enable()
                      im=Image.open('/tmp/ocr.png').convert('RGB')
                      r,g,b=im.getpixel((500,680))
                      if abs(r-g)<15 and abs(g-b)<15 and r>140:
                          tap(473,752);action='tutorial_dialog'
                      elif 'fikova' in s:
                          if not fikova:
                              tap(220,1130);tap(170,790);time.sleep(1);tap(360,1130);tap(170,830);fikova=True
                          elif time.time()-lastfire>8:
                              adb('swipe',490,1130,277,330,500);lastfire=time.time()
                          action='fikova_sequence'
                  elif 'winner' in s or ('reward' in s and 'clan' in s):
                      enable(False);tap(360,1160);action='result'
                  elif 'upgrade' in s and ('knight' in s or 'level' in s) and not ('rare card' in s or 'common card' in s):
                      enable(False)
                      if not clickword(ws,'upgrade',650):clickword(ws,'upgrade')
                      action='earned_currency_upgrade'
                  elif ('cards' in s and ('collection' in s or 'deck' in s)):
                      enable(False)
                      if not clickword(ws,'knight'):tap(530,130)
                      action='collection'
                  elif 'battle' in s and ('event' in s or 'stadium' in s or 'arena' in s):
                      enable(False)
                      if 'stadium' in s or 'arena' in s:
                          P('/tmp/training').unlink(missing_ok=True);in_ladder=True
                      clickword(ws,'battle',700);enable();action='start_battle'
                  elif 'rare card' in s or 'common card' in s or 'gold' in s and 'found' in s or 'chest' in s:
                      enable(False);tap(360,950);action='free_reward'
                  elif 'upgrade' in s and 'card' in s:
                      enable(False);tap(165,1213);action='open_collection'
                  if action:
                      P('armshots/auto-status.txt').write_text(str(round(time.time()-start))+' '+action+' ladder='+str(in_ladder))
                  time.sleep(2)
              except Exception as e:
                  P('armshots/auto-error.txt').write_text(type(e).__name__)
                  time.sleep(5)
          AUTOTUTORIAL
          python3 /tmp/autotutorial.py > /tmp/auto.log 2>&1 &
          AUTOPID=$!
          rm -f /tmp/stoprecord
          bash /tmp/record-loop.sh > /tmp/record.log 2>&1 &
          printf 321 > /tmp/lastseq
          LAST=321
          for i in $(seq 1 260); do
            git fetch -q origin main
            git show FETCH_HEAD:.github/workflows/control.txt > /tmp/control.json 2>/dev/null || echo '{}' > /tmp/control.json
            python3 - <<'CONTROL'
          import json,subprocess,pathlib,time,os
          from cryptography.fernet import Fernet
          try:
           d=json.load(open('/tmp/control.json'));seq=d.get('seq',0);old=pathlib.Path('/tmp/lastseq')
           if seq and str(seq)!=(old.read_text().strip() if old.exists() else ''):
            original=d.copy()
            if d.get('op')=='sealed':
             pathlib.Path('/tmp/privacy-until').write_text(str(time.time()+45))
             pathlib.Path('/tmp/stoprecord').touch()
             subprocess.run(['adb','shell','pkill','-INT','screenrecord'],capture_output=True)
             time.sleep(1)
             d=json.loads(Fernet(os.environ['CLASH_CONTROL_KEY'].encode()).decrypt(d['payload'].encode(),ttl=300))
            op=d.get('op');args=d.get('args',[])
            if op in ['tap','swipe','text','keyevent'] and isinstance(args,list):
             subprocess.run(['adb','shell','input',op]+[str(x) for x in args],timeout=15,capture_output=True)
            elif op=='bot':
             pathlib.Path('/tmp/bot-on').touch()
             if args and args[0]=='training':pathlib.Path('/tmp/training').touch()
             else:pathlib.Path('/tmp/training').unlink(missing_ok=True)
            elif op=='bot-off':
             pathlib.Path('/tmp/bot-on').unlink(missing_ok=True)
            elif op=='record':
             pathlib.Path('/tmp/stoprecord').unlink(missing_ok=True)
             subprocess.Popen(['bash','/tmp/record-loop.sh'],stdout=open('/tmp/record.log','w'),stderr=subprocess.STDOUT)
            elif op=='batch':
             for a in args[:30]:
              if a.get('op')=='wait':time.sleep(min(20,max(0,float(a.get('seconds',1)))))
              elif a.get('op') in ['tap','swipe','text','keyevent']:
               subprocess.run(['adb','shell','input',a['op']]+[str(x) for x in a.get('args',[])],timeout=15)
            elif op=='finish':pathlib.Path('/tmp/finish').touch()
            elif op=='pullrecord':
             subprocess.run(['adb','pull','/sdcard/match.mp4','armshots/match.mp4'],timeout=30)
            old.write_text(str(seq));pathlib.Path('armshots/last-command.txt').write_text(json.dumps(original))
          except Exception:pathlib.Path('armshots/control-error.txt').write_text('Command rejected; inspect command type and encryption locally, no contents logged.')
          CONTROL
            sleep 2
            python3 - <<'PRIVACY' > /tmp/privacy-state
          import pathlib,time
          p=pathlib.Path('/tmp/privacy-until');print(int(p.exists() and float(p.read_text())>time.time()))
          PRIVACY
            if [ "$(cat /tmp/privacy-state)" = 0 ]; then adb exec-out screencap -p > armshots/live.png; fi
            adb shell dumpsys activity activities > armshots/activity.txt
            date -u > armshots/live-time.txt
            git add armshots
            git commit -qm "live-$i" || true
            git push -qf origin HEAD:live-play
            test -f /tmp/finish && break
            sleep 5
          done
          kill "$AUTOPID" "$BOTPID" || true
          touch /tmp/stoprecord
          sleep 62
          adb shell ls /sdcard/game-*.mp4 | tr -d '\r' | while read f; do adb pull "$f" armshots/ || true; done
          adb pull /sdcard/match.mp4 armshots/match.mp4 || true
          adb pull /sdcard/clash-launch.mp4 armshots/clash-launch.mp4 || true
          mkdir -p persistence
          adb shell am force-stop com.supercell.clashroyale
          python3 - <<'BACKUP'
          import os,subprocess,pathlib
          from cryptography.fernet import Fernet
          r=subprocess.run(['sudo','docker','exec','android','tar','-czf','-','--exclude=cache','--exclude=code_cache','-C','/data/user/0','com.supercell.clashroyale'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
          pathlib.Path('persistence/account.fernet').write_bytes(Fernet(os.environ['CLASH_CONTROL_KEY'].encode()).encrypt(r.stdout))
          pathlib.Path('armshots/backup-status.txt').write_text('App data encrypted and staged for separate artifact; restore not yet independently verified.')
          BACKUP

      - name: Diagnostics
        if: always()
        run: |
          true # Game logcat excluded to avoid login material.
          sudo docker logs android > armshots/docker.txt 2>&1 || true
          sudo dmesg | tail -200 > armshots/dmesg.txt
          git config user.name orrimgames
          git config user.email bot@users.noreply.github.com
          git checkout --orphan native-arm-results
          git add armshots
          git commit -m 'Native ARM test results'
          git push -f origin HEAD:native-arm-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clash-save
          path: persistence/account.fernet
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-results
          path: armshots/
