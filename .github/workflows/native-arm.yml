name: native-arm
# Bounded free test of a compiled local controller, no account secrets.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/native-arm.yml
permissions:
  contents: write
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM Android test
        shell: bash
        env:
          CLASH_CONTROL_KEY: ${{ secrets.CLASH_CONTROL_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p armshots
          uname -a | tee armshots/host.txt
          sudo apt-get update
          sudo apt-get install -y adb linux-modules-extra-$(uname -r) python3-requests python3-cryptography python3-pil tesseract-ocr unzip g++ || sudo apt-get install -y adb python3-requests python3-cryptography python3-pil tesseract-ocr unzip g++
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          sudo modprobe ashmem_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          getconf PAGESIZE | tee armshots/pagesize.txt
          ls -l /dev/*binder* | tee armshots/binder.txt || true
          sudo docker run -d --name android --privileged -p 127.0.0.1:5555:5555 redroid/redroid:14.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest androidboot.redroid_width=720 androidboot.redroid_height=1280
          export ANDROID_SERIAL=127.0.0.1:5555
          adb devices -l | tee armshots/adb-devices.txt
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 || true; test "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break; sleep 5; done
          adb shell getprop > armshots/props.txt
          adb exec-out screencap -p > armshots/001-boot.png
          python3 - <<'PY'
          import requests,re,pathlib,zipfile
          u='https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.supercell.clashroyale'
          r=requests.get(u,headers={'x-cv':'3172501','x-sv':'35','x-abis':'arm64-v8a','x-gp':'1'},timeout=60)
          r.raise_for_status()
          pat=rb'(X?APKJ)..(https?://(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*))'
          m=re.search(pat,r.content)
          assert m,'no ARM64 download'
          url=m.group(2).decode()
          r=requests.get(url,stream=True,timeout=120)
          r.raise_for_status()
          with open('/tmp/arm64.xapk','wb') as f:
           for chunk in r.iter_content(1048576): f.write(chunk)
          zipfile.ZipFile('/tmp/arm64.xapk').extractall('/tmp/game')
          pathlib.Path('armshots/apkfiles.txt').write_text('\n'.join(str(p) for p in pathlib.Path('/tmp/game').iterdir()))
          PY
          adb install-multiple /tmp/game/*.apk | tee armshots/install.txt
          echo 'Fresh account; restoration deferred.' > armshots/restore-status.txt
          set +e
          adb logcat -c
          adb shell cmd package resolve-activity --brief com.supercell.clashroyale > armshots/resolve.txt 2>&1
          ACTIVITY=$(tr -d '\r' < armshots/resolve.txt | grep '/' | tail -1)
          timeout 30 adb shell am start -W -n "$ACTIVITY" > armshots/launch.txt 2>&1
          git config user.name orrimgames
          git config user.email bot@users.noreply.github.com
          cat > /tmp/bot.cpp <<'SOURCE'
          #include <bits/stdc++.h>
          #include <unistd.h>
          using namespace std;
          #include "cards.h"
          struct Image {int w=720,h=1280;vector<unsigned char> p; int at(int x,int y,int c)const{return p[(y*w+x)*4+c];}};
          Image capture(){Image a;FILE*f=popen("adb exec-out screencap 2>/tmp/capture-error","r"); if(!f)return a;vector<unsigned char>b;unsigned char z[65536];size_t n;while((n=fread(z,1,sizeof z,f)))b.insert(b.end(),z,z+n);pclose(f);if(b.size()<16)return a;memcpy(&a.w,b.data(),4);memcpy(&a.h,b.data()+4,4);if(a.w!=720||a.h!=1280||b.size()<size_t(a.w*a.h*4))return a;size_t off=b.size()-a.w*a.h*4;a.p.assign(b.begin()+off,b.end());return a;}
          void tap(int x,int y){string s="adb shell input tap "+to_string(x)+" "+to_string(y);system(s.c_str());}
          void play(int s,int x,int y){string cmd="adb shell 'input tap "+to_string(220+s*136)+" 1130; input tap "+to_string(x)+" "+to_string(y)+"'";system(cmd.c_str());}
          const char*names[]={"archers","arrows","knight","fireball","minions","mini_pekka","musketeer","giant","unknown"};
          int costs[]={3,3,3,4,3,4,4,5,99};
          vector<float> feature(const Image&a,int slot,int dy=0){vector<float>v;int x0=170+slot*136;for(int y=0;y<16;y++)for(int x=0;x<16;x++){int px=x0+x*95/16,py=1080+dy+y*80/16;float r=a.at(px,py,0),g=a.at(px,py,1),b=a.at(px,py,2);v.push_back(.299*r+.587*g+.114*b);}float m=accumulate(v.begin(),v.end(),0.f)/v.size(),sd=0;for(float z:v)sd+=(z-m)*(z-m);sd=sqrt(sd/v.size())+1;for(float&z:v)z=(z-m)/sd;return v;}
          pair<int,float>card(const Image&a,int slot){int best=8;float bd=1e9;for(int dy:{0,-12,8}){auto v=feature(a,slot,dy);for(int k=0;k<8;k++){float d=0;for(int j=0;j<256;j++)d+=pow(v[j]-CARD[k][j],2);d/=256;if(d<bd){bd=d;best=k;}}}return {bd<.8?best:8,bd};}
          float elixir(const Image&a){int n=0;for(int x=163;x<688;x++){int r=a.at(x,1249,0),g=a.at(x,1249,1),b=a.at(x,1249,2);if(r>100&&b>110&&g<120&&r>g*1.25)n++;}return min(10.f,n/52.5f);}
          pair<int,float>nextCard(const Image&a){vector<float>v;for(int y=0;y<16;y++)for(int x=0;x<16;x++){int px=44+x*43/16,py=1202+y*36/16;v.push_back(.299*a.at(px,py,0)+.587*a.at(px,py,1)+.114*a.at(px,py,2));}float m=accumulate(v.begin(),v.end(),0.f)/256,sd=0;for(float z:v)sd+=(z-m)*(z-m);sd=sqrt(sd/256)+1;for(float&z:v)z=(z-m)/sd;int k=8;float best=1e9;for(int i=0;i<8;i++){float d=0;for(int j=0;j<256;j++)d+=pow(v[j]-CARD[i][j],2);d/=256;if(d<best){best=d;k=i;}}return {best<.9?k:8,best};}
          struct Unit{int x,y,w,id;};
          vector<Unit>enemies(const Image&a){vector<Unit>v;for(int y=310;y<925;y+=3){for(int x=60;x<650;){int st=x;while(x<650){int r=a.at(x,y,0),g=a.at(x,y,1),b=a.at(x,y,2);if(!(r>130&&g<105&&b>45&&b<190&&r>g*1.5))break;x++;}int len=x-st;if(len>=18&&len<=100){bool duplicate=false;for(auto&u:v)if(abs(u.x-(st+len/2))<45&&abs(u.y-y)<40)duplicate=true;if(!duplicate)v.push_back({st+len/2,y,len,8});}x++;}}return v;}
          pair<int,int>trainingBox(const Image&a){for(int y=610;y<930;y+=3)for(int x=90;x<580;x+=3){auto white=[&](int xx,int yy){return a.at(xx,yy,0)>205&&a.at(xx,yy,1)>210&&a.at(xx,yy,2)>195;};if(!white(x,y))continue;int run=0;while(x+run<650&&white(x+run,y))run++;if(run<55||run>105)continue;int vert=0;for(int yy=y;yy<min(y+115,1000);yy++)if(white(x,yy))vert++;if(vert>60)return {x+run/2,y+45};}return {0,0};}
          struct Track{int x,y,id;double last;};
          int main(int argc,char**argv){bool dry=argc>1;Image test;if(dry){ifstream f(argv[1],ios::binary);test.p.assign(istreambuf_iterator<char>(f),{});if(test.p.size()!=720*1280*4)return 2;}
           ofstream log("armshots/decisions.csv",ios::app);log<<"time,match,elixir,opp_elixir_lo,opp_elixir_hi,slot,card,x,y,score,reason,capture_ms,decision_ms\n";auto start=chrono::steady_clock::now();double lastAction=-100,oppLo=5,oppHi=10,lastT=0;int match=0,trainingSlot=0;bool prevBattle=false;double lastBattle=-100;vector<Track>tracks;vector<int>ourCycle;ofstream state("armshots/state.json");
           for(int tick=0;tick<12000;tick++){auto a0=chrono::steady_clock::now();Image a=dry?test:capture();auto a1=chrono::steady_clock::now();if(a.p.empty()){usleep(500000);continue;}double t=chrono::duration<double>(a1-start).count(),dt=t-lastT;lastT=t;float e=min(10.f,elixir(a)*1.09f);array<int,4>hand;array<float,4>conf;for(int i=0;i<4;i++){auto q=card(a,i);hand[i]=q.first;conf[i]=q.second;}int valid=count_if(hand.begin(),hand.end(),[](int n){return n<8;});if(valid>=3)lastBattle=t;bool battle=valid>=2||t-lastBattle<5;bool enabled=ifstream("/tmp/bot-on").good()||dry;
           if(battle&&!prevBattle){match++;oppLo=5;oppHi=10;ourCycle.clear();tracks.clear();}prevBattle=battle;oppLo=min(10.,oppLo+dt/2.8);oppHi=min(10.,oppHi+dt/1.4);auto es=enemies(a);for(auto u:es){bool seen=false;for(auto &tr:tracks)if(t-tr.last<4&&abs(u.x-tr.x)<65&&abs(u.y-tr.y)<100){tr.x=u.x;tr.y=u.y;tr.last=t;seen=true;break;}if(!seen){tracks.push_back({u.x,u.y,8,t});if(u.y<530){oppLo=max(0.,oppLo-9);oppHi=max(0.,oppHi-1);}}}tracks.erase(remove_if(tracks.begin(),tracks.end(),[&](auto v){return t-v.last>5;}),tracks.end());
           if(tick%5==0){ofstream st("armshots/state.json");st<<"{\"match\":"<<match<<",\"own_elixir\":"<<e<<",\"opponent_elixir_interval\":["<<oppLo<<","<<oppHi<<"],\"hand\":[";for(int j=0;j<4;j++)st<<(j?",":"")<<"\""<<names[hand[j]]<<"\"";st<<"],\"own_next\":\""<<names[nextCard(a).first]<<"\",\"own_next_error\":"<<nextCard(a).second<<",\"own_recent_cycle\":[";for(size_t j=0;j<ourCycle.size();j++)st<<(j?",":"")<<"\""<<names[ourCycle[j]]<<"\"";st<<"],\"opponent_deck\":[],\"opponent_cycle\":\"unknown until reliable card identification\",\"note\":\"Elixir bounds are a conservative model; unknown units are not assigned invented cards\",\"enemy_tracks\":"<<tracks.size()<<"}";}
           if(!battle||!enabled||t-lastAction<.7){if(dry){cout<<"elixir="<<e<<" cards=";for(int k:hand)cout<<names[k]<<" ";cout<<" enemies="<<es.size()<<endl;break;}usleep(100000);continue;}
           auto box=trainingBox(a);int pick=-1,x=170,y=700;double best=-1e9;string why;bool training=ifstream("/tmp/training").good();if(training&&box.first){pick=(trainingSlot++)%4;x=box.first;y=box.second;best=100;why="tutorial_target";}else{
           int dangerY=0,dangerX=170,threatCount=0;for(auto u:es)if(u.y>540){threatCount++;if(u.y>dangerY){dangerY=u.y;dangerX=u.x;}}int lane=dangerX<360?170:550;
           for(int s=0;s<4;s++){int k=hand[s];if(k>=8||costs[k]>floor(e+.15))continue;double sc=-100;int px=170,py=700;string reason;
           if(threatCount){px=lane==170?245:475;py=min(820,max(650,dangerY+75));double counter[]={6,-8,7,-5,8,11,9,-6};sc=counter[k]+min(3,threatCount)*.7-costs[k]*.5;reason="defend_nearest";if(k==1||k==3){if(threatCount>=3){sc=k==1?8:7;px=dangerX;py=dangerY+30;}else sc=-20;}}
           else {px=170;py=k==7?860:760;double attack[]={2,-15,1,-15,2,3,4,8};sc=attack[k]-costs[k]*.25;reason="build_left_push";if(e<8.7)sc-=10; // reserve for defense, don't leak at ten
            if(!ourCycle.empty()&&ourCycle.back()==7&&(k==6||k==0||k==4)){sc+=6;py=830;reason="support_giant";}}
           if(sc>best){best=sc;pick=s;x=px;y=py;why=reason;}}
           if(best<0)pick=-1;
           }
           auto a2=chrono::steady_clock::now();double cm=chrono::duration<double,milli>(a1-a0).count(),dm=chrono::duration<double,milli>(a2-a1).count();if(pick>=0){log<<fixed<<setprecision(3)<<t<<","<<match<<","<<e<<","<<oppLo<<","<<oppHi<<","<<pick<<","<<names[hand[pick]]<<","<<x<<","<<y<<","<<best<<","<<why<<","<<cm<<","<<dm<<"\n";log.flush();if(!dry)play(pick,x,y);lastAction=t;ourCycle.push_back(hand[pick]);if(ourCycle.size()>8)ourCycle.erase(ourCycle.begin());}if(dry)break;usleep(120000);
           }
          }
          SOURCE
          cat > /tmp/cards.h <<'SOURCE'
          static const float CARD[8][256]={
