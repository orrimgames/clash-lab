name: native-arm
# Bounded follow-up: verify tutorial unlock and normal matchmaking controls.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/native-arm.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM Android test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p armshots
          uname -a | tee armshots/host.txt
          sudo apt-get update
          sudo apt-get install -y adb linux-modules-extra-$(uname -r) python3-requests unzip || sudo apt-get install -y adb python3-requests unzip
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          sudo modprobe ashmem_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          getconf PAGESIZE | tee armshots/pagesize.txt
          ls -l /dev/*binder* | tee armshots/binder.txt || true
          sudo docker run -d --name android --privileged -p 127.0.0.1:5555:5555 redroid/redroid:14.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest androidboot.redroid_width=720 androidboot.redroid_height=1280
          export ANDROID_SERIAL=127.0.0.1:5555
          adb devices -l | tee armshots/adb-devices.txt
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 || true; test "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break; sleep 5; done
          adb shell getprop > armshots/props.txt
          adb exec-out screencap -p > armshots/001-boot.png
          python3 - <<'PY'
          import requests,re,pathlib,zipfile
          u='https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.supercell.clashroyale'
          r=requests.get(u,headers={'x-cv':'3172501','x-sv':'35','x-abis':'arm64-v8a','x-gp':'1'},timeout=60)
          r.raise_for_status()
          pat=rb'(X?APKJ)..(https?://(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*))'
          m=re.search(pat,r.content)
          assert m,'no ARM64 download'
          url=m.group(2).decode()
          r=requests.get(url,stream=True,timeout=120)
          r.raise_for_status()
          with open('/tmp/arm64.xapk','wb') as f:
           for chunk in r.iter_content(1048576): f.write(chunk)
          zipfile.ZipFile('/tmp/arm64.xapk').extractall('/tmp/game')
          pathlib.Path('armshots/apkfiles.txt').write_text('\n'.join(str(p) for p in pathlib.Path('/tmp/game').iterdir()))
          PY
          adb install-multiple /tmp/game/*.apk | tee armshots/install.txt
          set +e
          adb logcat -c
          adb shell cmd package resolve-activity --brief com.supercell.clashroyale > armshots/resolve.txt 2>&1
          ACTIVITY=$(tr -d '\r' < armshots/resolve.txt | grep '/' | tail -1)
          adb shell screenrecord --time-limit 180 --bit-rate 4000000 /sdcard/clash-launch.mp4 > armshots/record.txt 2>&1 &
          RECORDPID=$!
          sleep 2
          timeout 30 adb shell am start -W -n "$ACTIVITY" > armshots/launch.txt 2>&1
          adb shell dumpsys package com.supercell.clashroyale > armshots/package.txt
          adb shell pm list packages -f > armshots/packages.txt
          sleep 15
          adb shell input tap 550 400
          sleep 3
          adb shell input tap 360 815
          git config user.name orrimgames
          git config user.email bot@users.noreply.github.com
          git checkout --orphan live-play
          git rm -rf --cached .
          cat > /tmp/record-loop.sh <<'REC'
          for j in $(seq -w 1 30); do
            test -f /tmp/stoprecord && break
            adb shell screenrecord --time-limit 60 --bit-rate 1500000 /sdcard/game-$j.mp4
          done
          REC
          LAST=0
          for i in $(seq 1 230); do
            git fetch -q origin main
            git show FETCH_HEAD:.github/workflows/control.txt > /tmp/control.json 2>/dev/null || echo '{}' > /tmp/control.json
            python3 - <<'CONTROL'
          import json,subprocess,pathlib,time
          try:
           d=json.load(open('/tmp/control.json'));seq=d.get('seq',0);old=pathlib.Path('/tmp/lastseq')
           if seq and str(seq)!=(old.read_text() if old.exists() else ''):
            op=d.get('op');args=d.get('args',[])
            if op in ['tap','swipe','text','keyevent'] and isinstance(args,list):
             subprocess.run(['adb','shell','input',op]+[str(x) for x in args],timeout=15)
            elif op=='record':
             subprocess.Popen(['bash','/tmp/record-loop.sh'],stdout=open('/tmp/record.log','w'),stderr=subprocess.STDOUT)
            elif op=='batch':
             for a in args[:30]:
              if a.get('op')=='wait':time.sleep(min(20,max(0,float(a.get('seconds',1)))))
              elif a.get('op') in ['tap','swipe','text','keyevent']:
               subprocess.run(['adb','shell','input',a['op']]+[str(x) for x in a.get('args',[])],timeout=15)
            elif op=='finish':pathlib.Path('/tmp/finish').touch()
            elif op=='pullrecord':
             subprocess.run(['adb','pull','/sdcard/match.mp4','armshots/match.mp4'],timeout=30)
            old.write_text(str(seq));pathlib.Path('armshots/last-command.txt').write_text(json.dumps(d))
          except Exception as e:pathlib.Path('armshots/control-error.txt').write_text(str(e))
          CONTROL
            sleep 2
            adb exec-out screencap -p > armshots/live.png
            adb shell dumpsys activity activities > armshots/activity.txt
            date -u > armshots/live-time.txt
            git add armshots
            git commit -qm "live-$i" || true
            git push -qf origin HEAD:live-play
            test -f /tmp/finish && break
            sleep 5
          done
          touch /tmp/stoprecord
          sleep 62
          adb shell ls /sdcard/game-*.mp4 | tr -d '\r' | while read f; do adb pull "$f" armshots/ || true; done
          adb pull /sdcard/match.mp4 armshots/match.mp4 || true
          adb pull /sdcard/clash-launch.mp4 armshots/clash-launch.mp4 || true
          adb logcat -b all -d > armshots/logcat.txt
      - name: Diagnostics
        if: always()
        run: |
          sudo docker exec android logcat -b all -d > armshots/docker-logcat.txt 2>&1 || true
          sudo docker logs android > armshots/docker.txt 2>&1 || true
          sudo dmesg | tail -200 > armshots/dmesg.txt
          git config user.name orrimgames
          git config user.email bot@users.noreply.github.com
          git checkout --orphan native-arm-results
          git add armshots
          git commit -m 'Native ARM test results'
          git push -f origin HEAD:native-arm-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-results
          path: armshots/
