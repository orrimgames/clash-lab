name: native-arm
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/native-arm.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Native ARM Android test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p armshots
          uname -a | tee armshots/host.txt
          sudo apt-get update
          sudo apt-get install -y adb linux-modules-extra-$(uname -r) python3-requests unzip || sudo apt-get install -y adb python3-requests unzip
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          sudo modprobe ashmem_linux || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs || true
          getconf PAGESIZE | tee armshots/pagesize.txt
          ls -l /dev/*binder* | tee armshots/binder.txt || true
          sudo docker run -d --name android --privileged -p 127.0.0.1:5555:5555 redroid/redroid:14.0.0-latest androidboot.use_memfd=1 androidboot.redroid_gpu_mode=guest androidboot.redroid_width=720 androidboot.redroid_height=1280
          export ANDROID_SERIAL=127.0.0.1:5555
          adb devices -l | tee armshots/adb-devices.txt
          for i in $(seq 1 60); do adb connect 127.0.0.1:5555 || true; test "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break; sleep 5; done
          adb shell getprop > armshots/props.txt
          adb exec-out screencap -p > armshots/001-boot.png
          python3 - <<'PY'
          import requests,re,pathlib,zipfile
          u='https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.supercell.clashroyale'
          r=requests.get(u,headers={'x-cv':'3172501','x-sv':'35','x-abis':'arm64-v8a','x-gp':'1'},timeout=60)
          r.raise_for_status()
          pat=rb'(X?APKJ)..(https?://(www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&//=]*))'
          m=re.search(pat,r.content)
          assert m,'no ARM64 download'
          url=m.group(2).decode()
          r=requests.get(url,stream=True,timeout=120)
          r.raise_for_status()
          with open('/tmp/arm64.xapk','wb') as f:
           for chunk in r.iter_content(1048576): f.write(chunk)
          zipfile.ZipFile('/tmp/arm64.xapk').extractall('/tmp/game')
          pathlib.Path('armshots/apkfiles.txt').write_text('\n'.join(str(p) for p in pathlib.Path('/tmp/game').iterdir()))
          PY
          adb install-multiple /tmp/game/*.apk | tee armshots/install.txt
          adb logcat -c
          adb shell monkey -p com.supercell.clashroyale -c android.intent.category.LAUNCHER 1 | tee armshots/launch.txt
          for i in $(seq 1 6); do sleep 20; adb exec-out screencap -p > armshots/$(printf '%03d' $((i+1)))-game.png; done
          adb logcat -b all -d > armshots/logcat.txt
          adb shell dumpsys activity activities > armshots/activity.txt
      - name: Diagnostics
        if: always()
        run: |
          sudo docker logs android > armshots/docker.txt 2>&1 || true
          sudo dmesg | tail -200 > armshots/dmesg.txt
          git config user.name orrimgames
          git config user.email bot@users.noreply.github.com
          git checkout --orphan native-arm-results
          git add armshots
          git commit -m 'Native ARM test results'
          git push -f origin HEAD:native-arm-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm-results
          path: armshots/
